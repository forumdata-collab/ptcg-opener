<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>寶可夢 TCG 抽卡機</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background:radial-gradient(1200px 800px at 50% -10%,#2a1a4a 0%,#141428 55%,#0d0d1e 100%);color:#fff;overflow-x:hidden;min-height:100vh;touch-action:manipulation}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px}
/* header */
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
.header h1{font-size:17px;font-weight:800;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.nav{display:flex;gap:8px}
.nav-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ddd;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s}
.nav-btn.active{background:linear-gradient(135deg,#e3350d,#c41e3a);border-color:#e3350d;color:#fff;box-shadow:0 4px 14px rgba(227,53,13,.4)}
/* pack page */
.pack-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 140px);padding:24px 20px;position:relative}
.stats-row{display:flex;gap:14px;margin-bottom:36px;font-size:13px;color:rgba(255,255,255,.75)}
.stats-row b{color:#ffd700;font-size:15px}
.pack-wrap{position:relative;width:260px;height:360px}
.pack{width:100%;height:100%;position:relative;cursor:grab;user-select:none;touch-action:none;transition:transform .08s;transform-style:preserve-3d}
.pack:active{cursor:grabbing}
.pack-body{position:absolute;inset:0;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.08),inset 0 2px 0 rgba(255,255,255,.25);will-change:transform}
.pack-top,.pack-half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.pack-top{top:0;background:linear-gradient(160deg,#ff5a2e 0%,#e3350d 45%,#b01030 100%)}
.pack-top::after{content:'';position:absolute;top:-40%;left:-20%;width:80%;height:120%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:rotate(10deg)}
.pack-bottom{top:50%;background:linear-gradient(160deg,#ffffff 0%,#f0f0f2 60%,#d8d8dc 100%)}
.pack-ball{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.pack-ball .b-top{position:absolute;top:0;left:0;right:0;height:48px;background:#e3350d;border:3px solid #1a1a2e;border-bottom:none;border-radius:48px 48px 0 0}
.pack-ball .b-mid{position:absolute;top:45px;left:0;right:0;height:6px;background:#1a1a2e}
.pack-ball .b-bottom{position:absolute;bottom:0;left:0;right:0;height:42px;background:#fff;border:3px solid #1a1a2e;border-top:none;border-radius:0 0 48px 48px}
.pack-ball .b-btn{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);background:#fff;border:3px solid #1a1a2e;border-radius:50%;z-index:2}
.pack-ball .b-btn::after{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);background:#1a1a2e;border-radius:50%}
.pack-label{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#1a1a2e;font-weight:800;font-size:15px;letter-spacing:3px;z-index:6}
.pack-label span{color:#e3350d}
/* pack tear halves */
.half-left,.half-right{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;pointer-events:none;opacity:0;will-change:transform,opacity}
.half-left{left:0;border-radius:18px 0 0 18px}
.half-right{right:0;border-radius:0 18px 18px 0}
.tearing .half-left{animation:tearL .55s cubic-bezier(.5,.05,.7,.4) forwards}
.tearing .half-right{animation:tearR .55s cubic-bezier(.5,.05,.7,.4) forwards}
@keyframes tearL{to{transform:translateX(-140%) rotate(-18deg);opacity:0}}
@keyframes tearR{to{transform:translateX(140%) rotate(18deg);opacity:0}}
.burst{position:absolute;left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(255,215,0,.85) 0%,rgba(255,140,0,.5) 35%,transparent 70%);border-radius:50%;pointer-events:none;opacity:0;z-index:3}
.burst.on{animation:burstOut .9s ease-out forwards}
@keyframes burstOut{0%{transform:translate(-50%,-50%) scale(0);opacity:1}70%{opacity:.9}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
.swipe-hint{margin-top:34px;color:rgba(255,255,255,.55);font-size:15px;display:flex;align-items:center;gap:10px;animation:hintPulse 1.8s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.55;transform:translateX(0)}50%{opacity:1;transform:translateX(12px)}}
.trail{position:absolute;top:50%;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd700,transparent);opacity:0;pointer-events:none;width:200px;transform:translate(-50%,-50%)}
/* cards result */
.result{display:none;min-height:calc(100vh - 90px);flex-direction:column;align-items:center;padding:30px 14px 20px}
.result.show{display:flex}
.cards-row{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap;max-width:480px;margin-bottom:26px}
.card{width:150px;height:210px;perspective:900px;cursor:pointer;flex-shrink:0;opacity:0}
.card.pop{animation:cardPop .55s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes cardPop{0%{transform:scale(.3) translateY(120px);opacity:0}60%{transform:scale(1.08) translateY(-16px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden}
/* back */
.card-back{background:linear-gradient(140deg,#1e3a8a,#3b82f6);display:flex;align-items:center;justify-content:center;border:3px solid #ffd700}
.card-back .cb-ball{width:56px;height:56px;position:relative;opacity:.9}
.card-back .cb-ball::before{content:'';position:absolute;inset:0;border:4px solid rgba(255,255,255,.35);border-radius:50%}
.card-back .cb-ball::after{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}
.card-back .cb-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border:3px solid rgba(255,255,255,.35);border-radius:50%}
.card-back .cb-txt{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.6);font-weight:700}
/* front */
.card-front{transform:rotateY(180deg);background:linear-gradient(150deg,#fdfcf7,#efece2);border:3px solid #b0b0b0;display:flex;flex-direction:column;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.card-front.t0{border-color:#b9b9b9}
.card-front.t1{border-color:#cd7f32;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 12px rgba(205,127,50,.25)}
.card-front.t2{border-color:#ffd700;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 16px rgba(255,215,0,.4)}
.card-front.t3{border-color:#a855f7;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(168,85,247,.55)}
.card-front.shiny{border:3px solid transparent;background:linear-gradient(150deg,#fdfcf7,#efece2) padding-box,linear-gradient(45deg,#ff004c,#ff9a00,#ffee00,#00d26a,#0090ff,#b200ff,#ff004c) border-box;background-size:100% 100%,400% 400%;animation:rainbow 3s linear infinite}
@keyframes rainbow{0%{background-position:0 0,0 50%}100%{background-position:0 0,400% 50%}}
.cf-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.cf-name{font-size:13px;font-weight:800;color:#222;line-height:1.15}
.cf-name small{display:block;font-size:7.5px;color:#888;font-weight:600}
.cf-hp{font-size:11px;font-weight:800;color:#e3350d}
.cf-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(120,200,240,.25),rgba(0,0,0,.04));border-radius:8px;margin:2px 0;overflow:hidden}
.cf-img img{max-width:100%;max-height:100%;object-fit:contain}
.cf-types{display:flex;gap:3px;margin-bottom:3px;min-height:14px}
.type-tag{font-size:8px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:700;letter-spacing:.5px}
.cf-foot{display:flex;justify-content:space-between;align-items:center}
.cf-set{font-size:6.5px;color:#999;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rarity-badge{font-size:8px;font-weight:800;padding:1px 6px;border-radius:4px;color:#fff}
.rarity-badge.t0{background:#9e9e9e}
.rarity-badge.t1{background:#cd7f32}
.rarity-badge.t2{background:#d4a500;color:#222}
.rarity-badge.t3{background:linear-gradient(135deg,#a855f7,#6d28d9)}
.rarity-badge.shiny{background:linear-gradient(45deg,#ff004c,#ff9a00,#ffee00,#00d26a,#0090ff);color:#fff}
/* sparkle overlay for shiny */
.sparkle{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px;opacity:.9}
.sparkle i{position:absolute;display:block;color:#ffd700;font-style:normal;font-size:13px;animation:spk 1.6s infinite}
.sparkle i:nth-child(1){top:12%;left:14%;animation-delay:0s}
.sparkle i:nth-child(2){top:70%;left:78%;animation-delay:.4s;font-size:10px}
.sparkle i:nth-child(3){top:38%;left:60%;animation-delay:.8s;font-size:11px}
.sparkle i:nth-child(4){top:80%;left:20%;animation-delay:1.1s;font-size:9px}
@keyframes spk{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
/* buttons */
.btn-primary{background:linear-gradient(135deg,#ff5a2e,#c41e3a);color:#fff;border:none;padding:13px 34px;border-radius:28px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(227,53,13,.45);transition:all .25s;letter-spacing:1px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(227,53,13,.6)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.18);padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer}
.result-actions{display:flex;gap:12px;margin-top:6px}
/* dex page */
.dex-page{display:none;padding:18px 16px;min-height:calc(100vh - 90px)}
.dex-page.show{display:block}
.progress-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin-bottom:16px}
.progress-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.progress-head b{color:#ffd700}
.progress-bar{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00);border-radius:6px;transition:width .5s ease;width:0}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.f-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#bbb;padding:5px 12px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .2s}
.f-btn.active{background:linear-gradient(135deg,#e3350d,#c41e3a);border-color:#e3350d;color:#fff}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dex-slot{aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.18);font-size:13px;cursor:default}
.dex-slot.owned{border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);cursor:pointer;transition:transform .2s}
.dex-slot.owned:hover{transform:translateY(-3px)}
.dex-slot img{width:100%;height:72%;object-fit:contain;display:block;background:radial-gradient(circle at 50% 40%,rgba(120,200,240,.2),transparent 75%)}
.dex-info{padding:5px 4px;text-align:center}
.dex-name{font-size:10px;color:#eee;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-rar{font-size:8px;margin-top:2px;color:#ffd700}
.dex-slot.owned.shiny{box-shadow:0 0 10px rgba(255,215,0,.5)}
.dex-note{text-align:center;color:rgba(255,255,255,.4);font-size:12px;margin-top:18px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-card{width:260px;height:364px;position:relative;transform-style:preserve-3d}
.modal-card .card-inner{transform:rotateY(180deg)}
.modal-card .card{width:100%;height:100%;opacity:1;animation:none}
.modal-close{position:absolute;top:-44px;right:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer}
/* celebration */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;animation:confetti 2.2s ease-out forwards}
@keyframes confetti{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
/* tutorial */
.tutorial{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:30px}
.tutorial.show{display:flex}
.tut-box{background:#1c1c36;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:26px 24px;max-width:340px;text-align:center}
.tut-box h2{color:#ffd700;font-size:19px;margin-bottom:12px}
.tut-box p{color:#bbb;font-size:14px;line-height:1.7;margin-bottom:8px}
.tut-box .tut-swipe{font-size:38px;margin:8px 0}
/* utility */
.muted{color:rgba(255,255,255,.4)}
footer.app-footer{text-align:center;padding:20px 20px 26px;margin-top:8px}
footer.app-footer .credit{font-size:11px;color:rgba(255,255,255,.38);margin-bottom:14px;line-height:1.7}
.kofi-bar{text-align:center}
.kofi-btn{display:inline-flex;align-items:center;gap:10px;padding:11px 26px;background:#ff5e5b;color:#fff !important;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚡ 寶可夢 TCG 抽卡機</h1>
    <div class="nav">
      <button class="nav-btn active" id="navPack" onclick="showView('pack')">抽卡</button>
      <button class="nav-btn" id="navDex" onclick="showView('dex')">圖鑑</button>
    </div>
  </div>

  <!-- PACK PAGE -->
  <div class="pack-page" id="viewPack">
    <div class="stats-row"><span>已開 <b id="statPacks">0</b> 包</span><span>收集 <b id="statColl">0</b>/151</span></div>
    <div class="pack-wrap" id="packWrap">
      <div class="burst" id="burst"></div>
      <div class="pack" id="pack">
        <div class="pack-body" id="packBody">
          <div class="pack-top"></div>
          <div class="pack-bottom"></div>
          <div class="pack-ball">
            <div class="b-top"></div><div class="b-mid"></div><div class="b-bottom"></div><div class="b-btn"></div>
          </div>
          <div class="pack-label">POKÉMON <span>TCG</span></div>
          <div class="half-left" id="halfL"></div>
          <div class="half-right" id="halfR"></div>
        </div>
      </div>
      <div class="trail" id="trail"></div>
    </div>
    <div class="swipe-hint" id="swipeHint">👆 橫掃卡包開啟</div>
  </div>

  <!-- RESULT -->
  <div class="result" id="viewResult">
    <div class="cards-row" id="cardsRow"></div>
    <div class="result-actions">
      <button class="btn-ghost" onclick="showView('dex')">睇圖鑑</button>
      <button class="btn-primary" onclick="openPack()">再開一包</button>
    </div>
  </div>

  <!-- DEX PAGE -->
  <div class="dex-page" id="viewDex">
    <div class="progress-card">
      <div class="progress-head"><span>圖鑑收集進度</span><b id="dexCount">0 / 151</b></div>
      <div class="progress-bar"><div class="progress-fill" id="dexFill"></div></div>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div class="dex-grid" id="dexGrid"></div>
    <div class="dex-note">收集全部 151 隻初代寶可夢！閃光版唔另計進度</div>
  </div>
</div>

<footer class="app-footer">
  <p class="credit">卡圖來源：PTCG-database（寶可夢官方繁中卡圖）· 教育及個人娛樂用途<br>寶可夢為任天堂／Creatures／GAME FREAK 商標</p>
  <div class="kofi-bar">
    <a class="kofi-btn" href="https://ko-fi.com/forumdata" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.47.06 8.529-1.723 8.649-4.916zm-11.638 8.978c-2.252 0-4.078-1.826-4.078-4.078s1.826-4.078 4.078-4.078 4.078 1.826 4.078 4.078-4.078z"/></svg>
      ☕ 請我飲杯咖啡
    </a>
  </div>
</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-card" id="modalCard"></div>
  </div>
</div>
<div class="celebrate" id="celebrate"></div>
<div class="tutorial" id="tutorial">
  <div class="tut-box">
    <h2>🎮 玩法說明</h2>
    <div class="tut-swipe">👆➡️</div>
    <p>喺卡包上向左橫掃，模擬撕開卡包！</p>
    <p>每包有 <b style="color:#ffd700">5 張卡</b>，稀有度由低到高遞增。</p>
    <p>點擊卡片可以<b style="color:#ffd700">翻面</b>睇 HP、招式同稀有度。</p>
    <p>收集卡片入圖鑑，齊 151 隻就完成！</p>
    <button class="btn-primary" style="margin-top:14px" onclick="closeTutorial()">開始抽卡！</button>
  </div>
</div>

// ===== DRAW LOGIC =====
// last cards have higher rarity chance
function weightedPick(weights){
  const keys = Object.keys(weights);
  let total = keys.reduce((s,k)=>s+weights[k],0);
  let r = Math.random()*total;
  for(const k of keys){ r -= weights[k]; if(r<=0) return parseInt(k); }
  return parseInt(keys[keys.length-1]);
}
function drawCards(){
  const out = [];
  const tiersByCard = {0:[],1:[],2:[],3:[]};
  CARDS.forEach(c=>tiersByCard[c.tier].push(c));
  for(let i=0;i<5;i++){
    // position-based weights
    let w;
    if(i<3) w = {0:58,1:30,2:10,3:2};
    else if(i===3) w = {0:32,1:36,2:24,3:8};
    else w = {0:18,1:30,2:38,3:14};
    const tier = weightedPick(w);
    const poolArr = tiersByCard[tier];
    const c = poolArr[Math.floor(Math.random()*poolArr.length)];
    const shiny = Math.random() < 0.04;
    out.push({...c, shiny, uid: Date.now()+'_'+i});
  }
  return out;
}

// ===== AUDIO (Web Audio synth) =====
let actx=null;
function audio(){ try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }catch(e){ return null; } }
function beep(freq,dur,type='sine',vol=.15,delay=0){
  const a=audio(); if(!a) return;
  const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX = {
  swipe(){ beep(300,.12,'triangle',.1); beep(500,.15,'triangle',.1,.08); },
  tear(){ beep(180,.25,'sawtooth',.12); beep(120,.3,'sawtooth',.12,.1); beep(90,.4,'sawtooth',.14,.2); },
  pop(i){ beep(520+i*80,.12,'sine',.12); },
  flip(){ beep(700,.08,'triangle',.08); },
  rare(){ [880,1108,1318,1760].forEach((f,i)=>beep(f,.18,'triangle',.14,i*.07)); },
  ultra(){ [523,659,784,1046,1318,1568,2093].forEach((f,i)=>beep(f,.2,'triangle',.15,i*.09)); },
};

// ===== PACK SWIPE =====
function initSwipe(){
  const pack = document.getElementById('pack');
  const wrap = document.getElementById('packWrap');
  let sx=0, sy=0, dx=0, active=false;
  const trail = document.getElementById('trail');
  const hint = document.getElementById('swipeHint');
  function start(e){
    if(busy) return;
    const t = e.touches?e.touches[0]:e;
    sx=t.clientX; sy=t.clientY; dx=0; active=true;
    pack.style.transition='none';
    trail.style.opacity=0;
  }
  function move(e){
    if(!active||busy) return;
    const t = e.touches?e.touches[0]:e;
    dx = t.clientX-sx;
    const dy = t.clientY-sy;
    const rot = Math.max(-18,Math.min(18, -dx*0.08));
    pack.style.transform = `rotate(${rot}deg) translateX(${dx*0.15}px)`;
    if(Math.abs(dx)>25){
      trail.style.opacity=Math.min(1,Math.abs(dx)/140);
      trail.style.left = (wrap.offsetWidth/2 + dx*0.4)+'px';
    }
    if(e.cancelable) e.preventDefault();
  }
  function end(){
    if(!active) return;
    active=false;
    pack.style.transform='';
    if(Math.abs(dx)>80 && !busy){
      SFX.swipe();
      openPack();
    }
  }
  pack.addEventListener('touchstart',start,{passive:false});
  pack.addEventListener('touchmove',move,{passive:false});
  pack.addEventListener('touchend',end);
  pack.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  hint.addEventListener('click',()=>{ if(!busy) openPack(); });
}

// ===== OPEN PACK =====
function openPack(){
  if(busy) return;
  busy=true;
  currentCards = drawCards();
  document.getElementById('swipeHint').style.display='none';
  const pack=document.getElementById('pack'), wrap=document.getElementById('packWrap');
  const halfL=document.getElementById('halfL'), halfR=document.getElementById('halfR');
  // clone body into halves for tear
  const body = document.getElementById('packBody').cloneNode(true);
  const ball=body.querySelector('.pack-ball'), label=body.querySelector('.pack-label');
  if(ball) ball.remove(); if(label) label.remove();
  halfL.innerHTML=''; halfR.innerHTML='';
  const cl = body.cloneNode(true); const cr = body.cloneNode(true);
  cl.style.cssText='position:absolute;left:0;top:0;bottom:0;width:200%;transform:translateX(0)';
  cr.style.cssText='position:absolute;left:-100%;top:0;bottom:0;width:200%;transform:translateX(0)';
  halfL.appendChild(cl); halfR.appendChild(cr);
  halfL.style.opacity=1; halfR.style.opacity=1;
  pack.classList.add('tearing');
  document.getElementById('burst').classList.add('on');
  SFX.tear();
  // hide original pack body
  document.getElementById('packBody').style.visibility='hidden';
  setTimeout(()=>{
    document.getElementById('burst').classList.remove('on');
    document.getElementById('viewPack').style.display='none';
    document.getElementById('viewResult').classList.add('show');
    renderResult();
    busy=false;
  }, 620);
}

// ===== RENDER RESULT =====
function renderResult(){
  const row=document.getElementById('cardsRow');
  row.innerHTML='';
  currentCards.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML = cardHTML(c, 'back');
    row.appendChild(d);
    setTimeout(()=>{ d.classList.add('pop'); SFX.pop(i); }, 200+i*170);
    d.addEventListener('click', ()=>{
      if(d.classList.contains('flipped')) return;
      SFX.flip();
      d.classList.add('flipped');
      d.querySelector('.card-face').outerHTML = cardHTML(c,'front');
      d.querySelector('.card-front').style.transform='rotateY(0deg)';
    });
  });
  // add to collection
  currentCards.forEach(c=>{
    const key = String(c.id);
    const cur = collection[key] || {shiny:false,count:0};
    if(c.shiny) cur.shiny=true;
    cur.count++;
    collection[key]=cur;
  });
  stats.packs++;
  saveState();
  updateStats();
  // celebrate if any rare+
  const hasRare = currentCards.some(c=>c.shiny || c.tier>=2);
  const hasUltra = currentCards.some(c=>c.tier===3 || c.shiny);
  setTimeout(()=>{
    if(hasUltra){ SFX.ultra(); celebrate(60); }
    else if(hasRare){ SFX.rare(); celebrate(24); }
  }, 1400);
}

function cardHTML(c, face){
  const tclass = c.tier===3?'t3':(c.tier===2?'t2':(c.tier===1?'t1':'t0'));
  const shinyCls = c.shiny?' shiny':'';
  const types = (c.types||[]).map(t=>`<span class="type-tag" style="background:${TYPE_COLORS[t]||'#999'}">${CN_TYPE[t]||t}</span>`).join('');
  const atk = (c.attacks&&c.attacks[0])?`${c.attacks[0].name}${c.attacks[0].damage?' '+c.attacks[0].damage:''}`:'';
  if(face==='back'){
    return `<div class="card-inner">
      <div class="card-face card-back"><div class="cb-ball"><div class="cb-dot"></div></div><div class="cb-txt">POKÉMON TCG</div></div>
      <div class="card-face card-front ${tclass}${shinyCls}">
        <div class="cf-top"><div class="cf-name">${c.zh}<small>${c.set||''}</small></div><div class="cf-hp">HP ${c.hp||'?'}</div></div>
        <div class="cf-img"><img src="${c.img}" alt="${c.zh}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect width=%22120%22 height=%22120%22 fill=%22%23e8e8e8%22/><text x=%2260%22 y=%2265%22 font-size=%2226%22 text-anchor=%22middle%22>❓</text></svg>'"></div>
        <div class="cf-types">${types}</div>
        <div class="cf-foot">
          <span class="cf-set">${c.num?('#'+c.num+' '):''}${atk?('招式 '+atk):''}</span>
          <span class="rarity-badge ${tclass}${shinyCls}">${c.shiny?'閃光':TIER[c.tier].label}</span>
        </div>
        ${c.shiny?'<div class="sparkle"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>':''}
      </div>
    </div>`;
  }
  return `<div class="card-face card-front ${tclass}${shinyCls}">
    <div class="cf-top"><div class="cf-name">${c.zh}<small>${c.set||''}</small></div><div class="cf-hp">HP ${c.hp||'?'}</div></div>
    <div class="cf-img"><img src="${c.img}" alt="${c.zh}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect width=%22120%22 height=%22120%22 fill=%22%23e8e8e8%22/><text x=%2260%22 y=%2265%22 font-size=%2226%22 text-anchor=%22middle%22>❓</text></svg>'"></div>
    <div class="cf-types">${types}</div>
    <div class="cf-foot">
      <span class="cf-set">${c.num?('#'+c.num+' '):''}${atk?('招式 '+atk):''}</span>
      <span class="rarity-badge ${tclass}${shinyCls}">${c.shiny?'閃光':TIER[c.tier].label}</span>
    </div>
    ${c.shiny?'<div class="sparkle"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>':''}
  </div>`;
}

// ===== VIEWS =====
function showView(v){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  ['pack','dex'].forEach(x=>{
    document.getElementById('view'+x[0].toUpperCase()+x.slice(1)).classList.remove('show');
  });
  if(v==='pack'){
    document.getElementById('navPack').classList.add('active');
    document.getElementById('viewPack').style.display='flex';
    document.getElementById('viewResult').classList.remove('show');
    document.getElementById('swipeHint').style.display='flex';
  }else{
    document.getElementById('navDex').classList.add('active');
    document.getElementById('viewPack').style.display='none';
    document.getElementById('viewResult').classList.remove('show');
    document.getElementById('viewDex').classList.add('show');
    renderDex();
  }
}

// ===== DEX =====
let dexFilter='all';
function initFilters(){
  const row=document.getElementById('filterRow');
  FILTERS.forEach(([k,l])=>{
    const b=document.createElement('button');
    b.className='f-btn'+(k==='all'?' active':'');
    b.textContent=l;
    b.onclick=()=>{ dexFilter=k; document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderDex(); };
    row.appendChild(b);
  });
}
function matchesFilter(c){
  if(dexFilter==='all') return true;
  if(dexFilter==='shiny') return !!(collection[c.id] && collection[c.id].shiny);
  return c.tier === parseInt(dexFilter[1]);
}
function renderDex(){
  const grid=document.getElementById('dexGrid');
  grid.innerHTML='';
  let owned=0;
  CARDS.forEach(c=>{
    const have = collection[c.id];
    if(have) owned++;
    if(!matchesFilter(c)) return;
    const slot=document.createElement('div');
    const isShiny = have && have.shiny;
    slot.className='dex-slot'+(have?' owned':'')+(isShiny?' shiny':'');
    if(have){
      const tclass = c.tier===3?'t3':(c.tier===2?'t2':(c.tier===1?'t1':'t0'));
      slot.innerHTML=`<img src="${c.img}" alt="${c.zh}" loading="lazy"><div class="dex-info"><div class="dex-name">${c.zh}${have.count>1?' ×'+have.count:''}${isShiny?' ✨':''}</div><div class="dex-rar">${TIER[c.tier].label}</div></div>`;
      slot.onclick=()=>openModal(c, isShiny);
    }else{
      slot.innerHTML='<span>?</span>';
    }
    grid.appendChild(slot);
  });
  document.getElementById('dexCount').textContent = `${owned} / 151`;
  document.getElementById('dexFill').style.width = (owned/151*100)+'%';
}
function openModal(c, shiny){
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=cardHTML({...c, shiny}, 'front');
  document.getElementById('modalCard').innerHTML=d.innerHTML;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

// ===== CELEBRATE =====
function celebrate(n){
  const el=document.getElementById('celebrate');
  el.innerHTML='';
  const colors=['#ffd700','#ff5a2e','#a855f7','#00d26a','#0090ff','#ff9a00'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.top=-20+'px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*0.8)+'s';
    p.style.width=p.style.height=(5+Math.random()*7)+'px';
    el.appendChild(p);
    setTimeout(()=>p.remove(), 3200);
  }
}

// ===== STATS =====
function updateStats(){
  document.getElementById('statPacks').textContent = stats.packs;
  document.getElementById('statColl').textContent = Object.keys(collection).length;
}

// ===== TUTORIAL =====
function closeTutorial(){
  document.getElementById('tutorial').classList.remove('show');
  try{ localStorage.setItem('ptcg_tut_v1','1'); }catch(e){}
}

// ===== INIT =====
loadState();
initFilters();
initSwipe();
updateStats();
if(!localStorage.getItem('ptcg_tut_v1')){
  setTimeout(()=>document.getElementById('tutorial').classList.add('show'), 400);
}
</script>
