<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141428">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>道館對戰 - 寶可夢 TCG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#2a1a4a 0%,#141428 55%,#0d0d1e 100%);
  color:#fff;overflow-x:hidden;min-height:100vh;touch-action:manipulation
}
.app{max-width:480px;margin:0 auto;position:relative;padding-bottom:20px;min-height:100vh;display:flex;flex-direction:column}

/* ========== HEADER ========== */
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)
}
.header h1{
  font-size:16px;font-weight:800;
  background:linear-gradient(90deg,#ffd700,#ff8c00);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.5px
}
.header .coins{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,215,0,.12);border:1.5px solid rgba(255,215,0,.4);
  border-radius:50px;padding:5px 14px;font-size:14px;font-weight:700;color:#ffd700
}
.header .back-link{
  color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;
  padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.06)
}
.header .back-link:hover{background:rgba(255,255,255,.12)}
.sound-btn{
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;color:#fff;font-size:15px;padding:5px 10px;cursor:pointer;
  line-height:1;transition:all .2s;flex-shrink:0
}
.sound-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.sound-btn.muted{opacity:.55}

/* ========== VIEW SYSTEM ========== */
.view{display:none;flex:1;flex-direction:column}
.view.active{display:flex}

/* ========== MENU VIEW ========== */
#menuView{padding:20px 16px;align-items:center;justify-content:center;text-align:center}
#menuView .logo{font-size:56px;margin-bottom:8px}
#menuView h2{font-size:22px;margin-bottom:6px;color:#fff}
#menuView .subtitle{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:24px}

.difficulty-select{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.diff-btn{
  flex:1;min-width:100px;padding:14px 8px;border-radius:14px;border:2px solid;
  background:transparent;color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  transition:all .2s;text-align:center
}
.diff-btn.easy{border-color:#4ade80}
.diff-btn.easy.selected{background:#4ade80;color:#000}
.diff-btn.normal{border-color:#fbbf24}
.diff-btn.normal.selected{background:#fbbf24;color:#000}
.diff-btn.hard{border-color:#f87171}
.diff-btn.hard.selected{background:#f87171;color:#000}

/* ===== BOSS MODE ===== */
.boss-section{margin-bottom:20px}
.boss-section .boss-label{color:#c4b5fd;font-size:12px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.diff-btn.boss{border-color:#a78bfa;background:rgba(167,139,250,.08)}
.diff-btn.boss.selected{background:#a78bfa;color:#000}
.diff-btn.boss.locked{filter:grayscale(1);opacity:.5;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(10px);background:rgba(20,20,30,.92);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#battleStage.mecha{background:url('gym-bg-mecha.jpg') center/cover no-repeat}
#battleStage.mecha .enemy-side img{width:150px}
#battleStage.mecha .hearts{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:2px 4px}
#battleView.boss #enemyTeamBar{display:none}  /* Boss 戰: 敵方 6 心已喺 info box, 刪重複列慳空間 */

.start-btn{
  width:100%;max-width:280px;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#e94560,#c23a51);color:#fff;
  font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(233,69,96,.4);
  transition:all .2s;margin-bottom:12px
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(233,69,96,.6)}
.start-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.howto-btn{
  background:transparent;color:rgba(255,255,255,.5);border:none;
  font-size:13px;cursor:pointer;padding:8px 16px
}
.howto-box{
  display:none;max-width:340px;margin-top:16px;text-align:left;
  background:rgba(255,255,255,.05);border-radius:14px;padding:18px;
  border:1px solid rgba(255,255,255,.08);font-size:13px;line-height:2;color:rgba(255,255,255,.7)
}
.howto-box h3{color:#ffd700;margin-bottom:10px;font-size:15px}
.howto-box p{margin-bottom:4px}

/* ========== BATTLE VIEW ========== */
#battleView{padding:0 12px 12px}

/* 隊列 */
.team-bar{display:flex;justify-content:center;gap:6px;padding:8px 0}
.team-slot{
  width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.15);
  overflow:hidden;position:relative;background:rgba(0,0,0,.4);transition:all .3s
}
.team-slot.active{border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.4);transform:scale(1.08)}
.team-slot.fainted{opacity:.25;filter:grayscale(1)}
.team-slot img{width:100%;height:100%;object-fit:contain}
.team-slot .hp-dots{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px
}
.team-slot .hp-dot{width:5px;height:5px;border-radius:50%;background:#ef4444}
.team-slot .hp-dot.alive{background:#22c55e}

/* 對戰舞台 */
.battle-stage{
  position:relative;flex:1;min-height:220px;max-height:320px;
  background:url('gym-bg.jpg') center/cover no-repeat;
  border-radius:16px;border:1px solid rgba(255,255,255,.08);
  overflow:hidden;margin:4px 0
}
.battle-stage::before{
  content:"";position:absolute;bottom:0;left:0;right:0;height:35%;
  background:linear-gradient(180deg,transparent 0%,rgba(34,197,94,.08) 100%);
  pointer-events:none
}

/* 場地裝飾線 */
.arena-line{
  position:absolute;bottom:28%;left:10%;right:10%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  border-radius:1px
}

.combatant{position:absolute;width:130px;text-align:center;transition:all .3s}
.combatant.enemy-side{top:8%;right:8%}
.combatant.player-side{bottom:-33px;left:calc(33.333% - 122.5px)}
.combatant img{
  width:114px;height:114px;object-fit:contain;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));transition:all .3s;
  --fx:scaleX(1)
}
.combatant.player-side img.flipped-back{--fx:scaleX(-1)}
.combatant.player-side img{width:195px;height:195px}
.combatant.player-side img.flipped-back{transform:scaleX(-1)}

/* 原生遊戲佈局：敵方資訊左上角, 我方資訊右下角 */
.enemy-info,.player-info{
  position:absolute;z-index:5;text-align:center;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:5px 12px;min-width:96px
}
.enemy-info{top:8px;left:10px}
.player-info{bottom:8px;right:10px}

/* 臨時定位格 (debug, ?grid=1 先顯示) */
.debug-grid{position:absolute;inset:0;z-index:50;pointer-events:none}
.debug-grid .cell{position:absolute;border:1px dashed rgba(255,255,255,.75)}
.debug-grid .cell span{
  position:absolute;top:2px;left:2px;font-size:11px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.65);padding:1px 5px;border-radius:4px
}

/* 受傷閃白 */
.combatant img.hit{animation:flashWhite .3s ease}
@keyframes flashWhite{0%,100%{filter:brightness(1)}50%{filter:brightness(3) saturate(0)}}

/* 擊退 */
.combatant img.knockback{animation:knockback .5s ease}
@keyframes knockback{0%{transform:translateX(0)}30%{transform:translateX(-25px)}100%{transform:translateX(0)}}

/* 攻擊衝刺 */
.combatant.player-side img.attack-lunge{animation:lungeRight .3s ease}
.combatant.enemy-side img.attack-lunge{animation:lungeLeft .3s ease}
@keyframes lungeRight{0%{transform:translateX(0)}50%{transform:translateX(50px) scale(1.1)}100%{transform:translateX(0)}}
@keyframes lungeLeft{0%{transform:translateX(0)}50%{transform:translateX(-50px) scale(1.1)}100%{transform:translateX(0)}}

.poke-name{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hearts{display:flex;justify-content:center;gap:3px;margin-top:3px}
.heart{font-size:16px;transition:all .3s}
.heart.lost{opacity:.15;transform:scale(.6)}

.type-badges{display:flex;justify-content:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.type-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700}
.type-Grass{background:#78c850;color:#000}
.type-Fire{background:#f08030;color:#000}
.type-Water{background:#6890f0;color:#fff}
.type-Electric{background:#f8d030;color:#000}
.type-Psychic{background:#f85888;color:#fff}
.type-Fighting{background:#c03028;color:#fff}
.type-Normal{background:#a8a878;color:#000}
.type-Ice{background:#98d8d8;color:#000}
.type-Poison{background:#a040a0;color:#fff}
.type-Ground{background:#e0c068;color:#000}
.type-Flying{background:#a890f0;color:#000}
.type-Bug{background:#a8b820;color:#000}
.type-Rock{background:#b8a038;color:#000}
.type-Ghost{background:#705898;color:#fff}
.type-Dragon{background:#7038f8;color:#fff}
.type-Dark{background:#705848;color:#fff}
.type-Steel{background:#b8b8d0;color:#000}
.type-Fairy{background:#ee99ac;color:#000}

/* 屬性提示 */
.type-hint{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:700;z-index:8;pointer-events:none;opacity:0;transition:opacity .3s
}
.type-hint.show{opacity:1}
.type-hint.advantage{color:#4ade80}
.type-hint.disadvantage{color:#f87171}
.type-hint.neutral{color:#aaa}

/* 輪轉: 退場 (精靈化光縮入球) */
.poke-exit{animation:pokeExit .4s ease-in forwards}
@keyframes pokeExit{
  0%{opacity:1;transform:var(--fx) translateY(0) scale(1);filter:brightness(1)}
  50%{filter:brightness(4) saturate(.3)}
  100%{opacity:0;transform:var(--fx) translateY(14px) scale(.15);filter:brightness(5)}
}

/* 輪轉: 入場 (白光中彈出現身, overshoot) */
.poke-entrance{animation:pokeEnter .6s ease-out}
@keyframes pokeEnter{
  0%{opacity:0;transform:var(--fx) scale(.1) translateY(30px);filter:brightness(5)}
  55%{opacity:1;filter:brightness(2.5);transform:var(--fx) scale(1.12) translateY(-6px)}
  80%{transform:var(--fx) scale(.97)}
  100%{opacity:1;transform:var(--fx) scale(1) translateY(0);filter:brightness(1)}
}

/* 精靈球飛出/收回 (GBA 輪轉, 純 CSS 畫球; --bx = 拋物線水平方向) */
.poke-ball{
  position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
  border-radius:50%;opacity:0;pointer-events:none;z-index:7;
  background:linear-gradient(180deg,#ef4444 0%,#ef4444 46%,#333 46%,#333 54%,#fff 54%,#fff 100%);
  border:2px solid #333;box-shadow:0 3px 8px rgba(0,0,0,.5);
  --bx:0px
}
.enemy-side .poke-ball{--bx:70px}
.player-side .poke-ball{--bx:-70px}
.poke-ball::after{
  content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;background:#fff;border:2px solid #333
}
/* 白光 (出場爆開, 球本體 fade + ::before 白光) */
.poke-ball::before{
  content:"";position:absolute;inset:-24px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,.5) 45%,transparent 70%);
  opacity:0
}
.poke-ball.ball-flash{animation:ballFadeOut .55s ease-out forwards}
.poke-ball.ball-flash::before{animation:ballFlash .55s ease-out forwards}
@keyframes ballFadeOut{0%{opacity:1}100%{opacity:0}}
@keyframes ballFlash{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
/* 收回: 精靈先化光縮入(.15s), 球先出現彈起然後飛走 (畫弧返 trainer) */
.poke-ball.ball-catch{animation:ballCatch .4s ease-in .15s forwards}
@keyframes ballCatch{
  0%{opacity:1;transform:translate(var(--bx),0) scale(1) rotate(0)}
  30%{transform:translate(calc(var(--bx)*.5),-8px) scale(.9) rotate(20deg)}
  100%{opacity:0;transform:translate(var(--bx),170px) scale(.35) rotate(180deg)}
}
/* 飛出: 球由 trainer 位畫弧飛上→落地彈跳→停定 (0% 隱形 fade 入, 同收回分開) */
.poke-ball.ball-throw{animation:ballThrow .55s ease-out forwards}
@keyframes ballThrow{
  0%{opacity:0;transform:translate(var(--bx),170px) scale(.35) rotate(-160deg)}
  30%{opacity:1;transform:translate(calc(var(--bx)*.2),-14px) scale(1.15) rotate(-30deg)}
  50%{transform:translate(0,0) scale(.9) rotate(0)}
  65%{transform:translate(0,-8px) scale(1.05) rotate(5deg)}
  80%{transform:translate(0,0) scale(.97)}
  100%{opacity:1;transform:translate(0,0) scale(1)}
}
.fainted-img{filter:grayscale(1) brightness(.4) !important}

/* 全屏白閃 (GBA 放精靈 signature) */
.stage-flash{
  position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40
}
.stage-flash.on{animation:stageFlash .5s ease-out}
@keyframes stageFlash{0%{opacity:.85}100%{opacity:0}}

/* 戰鬥訊息 */
.battle-msg{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
  font-size:15px;font-weight:800;padding:10px 22px;border-radius:12px;
  z-index:20;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap
}
.battle-msg.show{opacity:1}
.battle-msg.good{background:rgba(34,197,94,.92);color:#fff}
.battle-msg.bad{background:rgba(239,68,68,.92);color:#fff}
.battle-msg.info{background:rgba(59,130,246,.92);color:#fff}
.battle-msg.crit{background:rgba(255,215,0,.95);color:#000}

/* 金幣彈出 */
.coin-popup{
  position:absolute;font-size:20px;font-weight:800;color:#ffd700;
  text-shadow:0 0 12px rgba(255,215,0,.8);z-index:30;pointer-events:none;
  animation:coinFloat 1.2s ease-out forwards
}
@keyframes coinFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}

/* ========== 進度與連擊區 ========== */
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;margin:4px 0;font-size:13px;color:rgba(255,255,255,.6)
}
.status-bar .progress{font-weight:700;color:#fff}
.status-bar .streak{
  background:linear-gradient(90deg,#ff6b35,#f7c600);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:800;font-size:14px
}

/* ========== 題目區 ========== */
.question-area{
  background:rgba(0,0,0,.5);border-radius:16px;padding:16px;
  border:1px solid rgba(255,255,255,.08);margin:4px 0
}
.question-label{
  font-size:11px;color:#ffd700;text-transform:uppercase;letter-spacing:2px;
  margin-bottom:8px;text-align:center
}
#mathQuestion{
  font-size:28px;font-weight:800;text-align:center;margin:8px 0;
  font-family:"Courier New",monospace;letter-spacing:2px;color:#fff
}

/* 四選一 */
.choices-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px
}
.choice-btn{
  padding:16px 8px;border-radius:14px;border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#fff;font-size:20px;font-weight:800;
  cursor:pointer;transition:all .15s;text-align:center;font-family:"Courier New",monospace
}
.choice-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.choice-btn:active{transform:scale(.96)}
.choice-btn.correct{background:rgba(34,197,94,.25);border-color:#22c55e;color:#4ade80}
.choice-btn.wrong{background:rgba(239,68,68,.25);border-color:#ef4444;color:#f87171}
.choice-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* 計時條 */
.timer-wrap{margin-top:10px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#timerBar{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);width:100%;transition:width .1s linear}

/* 控制按鈕 */
.battle-controls{display:flex;gap:10px;margin-top:10px}
.battle-controls button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-forfeit{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.12)}
.btn-forfeit:hover{background:rgba(255,255,255,.12)}
.btn-revive{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
.btn-revive:disabled{opacity:.3;cursor:not-allowed}

/* ========== RESULT VIEW ========== */
#resultView{padding:40px 20px;align-items:center;justify-content:center;text-align:center}
.result-title{font-size:32px;font-weight:800;margin-bottom:8px}
.result-title.victory{color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.4)}
.result-title.defeat{color:#ef4444}
.result-subtitle{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:24px}

.result-stats{
  background:rgba(255,255,255,.05);border-radius:18px;padding:20px;
  width:100%;max-width:340px;border:1px solid rgba(255,255,255,.08)
}
.stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stat-row:last-child{border-bottom:none}
.stat-label{color:rgba(255,255,255,.5);font-size:14px}
.stat-value{font-weight:800;color:#fff;font-size:15px}
.stat-value.gold{color:#ffd700}

.result-btns{display:flex;gap:12px;margin-top:24px;width:100%;max-width:340px}
.result-btns button{flex:1;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#e94560,#c23a51);color:#fff}
.btn-primary:hover{transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.15)}

/* 響應式 */
@media(max-width:380px){
  .combatant{width:110px}
  .combatant img{width:102px;height:102px}
  .combatant.player-side img{width:162px;height:162px}
  .combatant.enemy-side{right:6%;top:7%}
  .combatant.player-side{left:calc(33.333% - 101px);bottom:-27px}
  .enemy-info,.player-info{min-width:84px;padding:4px 8px}
  #mathQuestion{font-size:24px}
  .choice-btn{padding:14px 6px;font-size:18px}
}
</style>
</head>
<body>
<div class="app">

<!-- ========== HEADER ========== -->
<div class="header">
  <a href="index.html" class="back-link">← 返回</a>
  <h1>🏟️ 道館對戰</h1>
  <button class="sound-btn" id="soundToggle" onclick="toggleSound()" aria-label="音樂開關">🔊</button>
  <div class="coins">🪙<span id="coinCount">0</span></div>
</div>
<audio id="bgm" src="gym-bgm.mp3" loop preload="auto"></audio>

<!-- ========== MENU VIEW ========== -->
<section id="menuView" class="view active">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
    <div class="logo">⚔️</div>
    <h2>道館對戰</h2>
    <p class="subtitle">用數學擊倒對手，贏取金幣！</p>

function generateChoices(correctAnswer){
  const choices=new Set([correctAnswer]);
  let attempts=0;
  while(choices.size<4&&attempts<50){
    const offset=rand(1,3)*10; // 個位同答案, 防淨計個位破解
    const sign=Math.random()>.5?1:-1;
    const wrong=correctAnswer+offset*sign;
    if(wrong>0&&wrong!==correctAnswer)choices.add(wrong);
    attempts++;
  }
  while(choices.size<4){
    const w=rand(1,Math.max(correctAnswer*2,50));
    if(w!==correctAnswer)choices.add(w);
  }
  return Array.from(choices).sort(()=>Math.random()-.5);
}

// ===== TEAM GENERATION =====
function getEnemyTeam(difficulty){
  const range=DIFFICULTY_RANGES[difficulty];
  const pool=CARDS.filter(c=>c.id<=range.enemyPoolSize&&c.tier<=range.enemyTierMax);
  const team=[];const used=new Set();
  while(team.length<5&&used.size<pool.length){
    const c=pool[Math.floor(Math.random()*pool.length)];
    if(!used.has(c.id)){used.add(c.id);team.push({...c,currentHp:MAX_HP,maxHp:MAX_HP})}
  }
  while(team.length<5){
    const c=CARDS[Math.floor(Math.random()*CARDS.length)];
    if(!used.has(c.id)){used.add(c.id);team.push({...c,currentHp:MAX_HP,maxHp:MAX_HP})}
  }
  return team;
}

function getPlayerTeam(){
  const caught=Object.keys(collection).map(Number);
  const starters=[1,4,7];
  while(caught.length<5){
    const s=starters[Math.floor(Math.random()*starters.length)];
    if(!caught.includes(s))caught.push(s);
    if(caught.length>=starters.length&&caught.length<5)break;
  }
  const pool=caught.length>=5?caught.sort(()=>0.5-Math.random()).slice(0,5):caught;
  return pool.map(id=>{
    const c=CARDS.find(x=>x.id===id)||CARDS[0];
    return{...c,currentHp:MAX_HP,maxHp:MAX_HP};
  });
}

function getTypeEffectiveness(attackerTypes,defenderTypes){
  let mult=1;
  for(const at of attackerTypes){
    const chart=TYPE_CHART[at];if(!chart)continue;
    for(const dt of defenderTypes){
      if(chart.strong.includes(dt))mult*=1.3;
      if(chart.weak.includes(dt))mult*=0.7;
    }
  }
  return mult;
}
function isSuperEffective(a,d){return getTypeEffectiveness(a,d)>1.1}
function isNotEffective(a,d){return getTypeEffectiveness(a,d)<0.9}

function getTypeHintText(pPoke,ePoke){
  const eff=getTypeEffectiveness(pPoke.types,ePoke.types);
  if(eff>1.1)return{cls:'advantage',text:`⚡ ${CN_TYPE[pPoke.types[0]]||pPoke.types[0]} > ${CN_TYPE[ePoke.types[0]]||ePoke.types[0]} 屬性有利！`};
  if(eff<0.9)return{cls:'disadvantage',text:`⚠️ ${CN_TYPE[pPoke.types[0]]||pPoke.types[0]} < ${CN_TYPE[ePoke.types[0]]||ePoke.types[0]} 屬性不利！`};
  return{cls:'neutral',text:`${CN_TYPE[pPoke.types[0]]||pPoke.types[0]} vs ${CN_TYPE[ePoke.types[0]]||ePoke.types[0]}`};
}

// ===== SPRITES =====
// 預載精靈圖 (official-artwork 大圖 + back sprite), 避免輪轉動畫期間先下載 → 現身時空白
function preloadSprites(id){
  [SPRITE_URLS.enemyFront(id),SPRITE_URLS.playerBack(id),
   SPRITE_URLS.playerBackFallback(id),SPRITE_URLS.playerBackLastResort(id)]
    .forEach(u=>{const i=new Image();i.src=u});
}
function loadEnemySprite(imgEl,pokemonId){
  imgEl.src=SPRITE_URLS.enemyFront(pokemonId);
  imgEl.onerror=()=>{
    imgEl.src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${pokemonId}.png`;
    imgEl.onerror=()=>{const c=CARDS.find(x=>x.id===pokemonId);if(c&&c.img)imgEl.src=c.img};
  };
}
function loadPlayerSprite(imgEl,pokemonId){
  const urls=[SPRITE_URLS.playerBack(pokemonId),SPRITE_URLS.playerBackFallback(pokemonId)];
  let idx=0;
  function tryNext(){
    if(idx>=urls.length){imgEl.src=SPRITE_URLS.playerBackLastResort(pokemonId);imgEl.classList.add('flipped-back');return}
    imgEl.src=urls[idx++];
    imgEl.onerror=tryNext;
    imgEl.onload=()=>imgEl.classList.remove('flipped-back');
  }
  imgEl.classList.remove('flipped-back');
  tryNext();
}

// ===== BATTLE CORE =====
let battleGen=0;  // 新開戰遞增 → 舊輪轉嘅 pending setTimeout 全部失效 (防投降/結束後 race)
function startBattle(){
  battleGen++;
  const boss=currentDifficulty==='boss';
  ANSWER_TIME=boss?20:15;
  // 精英=FireRed Gym, 冠軍=HGSS Champion, Boss=GSC Gym Leader (Kanto), 新手=原 BGM
  document.getElementById('bgm').src=boss?'gym-bgm-mecha.mp3':currentDifficulty==='normal'?'gym-bgm-elite.mp3':currentDifficulty==='hard'?'gym-bgm-champion.mp3':'gym-bgm.mp3';
  initAudio();
  loadCollection();
  const enemyTeam=boss
    ?[{id:-1,zh:'機械超夢',types:[],currentHp:6,maxHp:6,img:'gym-mecha-boss.png'}]
    :getEnemyTeam(currentDifficulty);
  battleState={
    phase:'battle',enemyTeam,playerTeam:getPlayerTeam(),boss,
    bossQuestions:boss?[...BOSS_QUESTIONS].sort(()=>Math.random()-.5).slice(0,6):null,  // 60 題隨機抽 6
    enemyIndex:0,playerIndex:0,coinsEarned:0,questionsCorrect:0,questionsTotal:0,
    currentQuestion:null,timeLeft:ANSWER_TIME,roundBusy:false,streak:0,bestStreak:0
  };
  document.getElementById('battleStage').classList.toggle('mecha',boss);
  document.getElementById('battleView').classList.toggle('boss',boss);
  hideMsg();  // 清除上一場殘留嘅戰鬥訊息
  showView('battleView');
  // 新開戰: 清空精靈 pid + src, 當首次出場 → 直接拋球釋出 (唔會行「收返舊精靈」)
  // opacity=0 隱藏舊精靈/空白/broken icon, 直到各自白光嗰刻解除
  const eImg0=document.getElementById('enemyImg'),pImg0=document.getElementById('playerImg');
  eImg0.dataset.pid='';eImg0.src='';eImg0.style.opacity=0;
  pImg0.dataset.pid='';pImg0.src='';pImg0.style.opacity=0;
  renderTeamBars();
  renderCombatants();
  updateTypeHint();
  updateProgress();
  nextQuestion();
}

function renderTeamBars(){
  const eBar=document.getElementById('enemyTeamBar');
  const pBar=document.getElementById('playerTeamBar');
  if(battleState.boss){
    const b=battleState.enemyTeam[0];
    eBar.innerHTML=`<div class="team-slot ${b.currentHp>0?'active':'fainted'}"><img src="gym-mecha-boss.png" alt=""><div class="hp-dots">${Array(6).fill(0).map((_,j)=>`<div class="hp-dot ${j<b.currentHp?'alive':''}"></div>`).join('')}</div></div>`;
  }else{
  eBar.innerHTML=battleState.enemyTeam.map((p,i)=>
    `<div class="team-slot ${i===battleState.enemyIndex?'active':''} ${p.currentHp<=0?'fainted':''}">`+
    `<img src="${SPRITE_URLS.enemyFront(p.id)}" onerror="this.src='${SPRITE_URLS.playerBackLastResort(p.id)}'" alt="">`+
    `<div class="hp-dots">${Array(MAX_HP).fill(0).map((_,j)=>`<div class="hp-dot ${j<p.currentHp?'alive':''}"></div>`).join('')}</div></div>`
  ).join('');
  }
  pBar.innerHTML=battleState.playerTeam.map((p,i)=>
    `<div class="team-slot ${i===battleState.playerIndex?'active':''} ${p.currentHp<=0?'fainted':''}">`+
    `<img src="${SPRITE_URLS.playerBackLastResort(p.id)}" alt="">`+
    `<div class="hp-dots">${Array(MAX_HP).fill(0).map((_,j)=>`<div class="hp-dot ${j<p.currentHp?'alive':''}"></div>`).join('')}</div></div>`
  ).join('');
}

function renderCombatants(){
  const ePoke=battleState.enemyTeam[battleState.enemyIndex];
  const pPoke=battleState.playerTeam[battleState.playerIndex];
  if(!ePoke||!pPoke)return;
  const eImg=document.getElementById('enemyImg');
  const gen=battleGen;
  // 玩家渲染兩邊共用
  preloadSprites(pPoke.id);
  document.getElementById('playerName').textContent=pPoke.zh;
  document.getElementById('playerTypes').innerHTML=pPoke.types.map(t=>`<span class="type-badge type-${t}">${CN_TYPE[t]||t}</span>`).join('');
  renderHearts('playerHearts',pPoke.currentHp);
  const pImg=document.getElementById('playerImg');
  pImg.classList.remove('fainted-img','hit','knockback','attack-lunge');
  swapCombatant(pImg,loadPlayerSprite,pPoke.id);  // 我方先出
  if(battleState.boss){
    // Boss: 機械超夢 — 本地 PNG, 6 心, 唔用 PokeAPI
    document.getElementById('enemyName').textContent=ePoke.zh;
    document.getElementById('enemyTypes').innerHTML='<span class="type-badge type-psychic">機械</span>';
    renderHearts('enemyHearts',ePoke.currentHp,6);
    eImg.classList.remove('fainted-img','hit','knockback','attack-lunge');
    setTimeout(()=>{if(gen!==battleGen)return;swapCombatant(eImg,(im)=>{im.src='gym-mecha-boss.png'},-1)},100);
  }else{
  preloadSprites(ePoke.id);  // 動畫期間(1.4s)預先下載, 現身時即刻顯示
  document.getElementById('enemyName').textContent=ePoke.zh;
  document.getElementById('enemyTypes').innerHTML=ePoke.types.map(t=>`<span class="type-badge type-${t}">${CN_TYPE[t]||t}</span>`).join('');
  renderHearts('enemyHearts',ePoke.currentHp);
  eImg.classList.remove('fainted-img','hit','knockback','attack-lunge');
  // 敵方等玩家完整出場(收返850+球飛550+現身600=2000ms)先開始, 兩邊動畫零重疊
  const pChanging=pImg.dataset.pid!==String(pPoke.id);  // ''(首戰/再戰)都算要動畫
  setTimeout(()=>{
    if(gen!==battleGen)return;  // 已開新戰, 舊排程失效
    swapCombatant(eImg,loadEnemySprite,ePoke.id);
  },pChanging?2000:100);
  }
}

// 精靈輪轉: 球收回→舊精靈化光退場→新球飛出落地彈跳→白光→精靈現身 (GBA 節奏)
function swapCombatant(imgEl,loadFn,pokeId){
  imgEl.classList.remove('poke-entrance','poke-exit');
  if(imgEl.dataset.pid===String(pokeId))return;  // 同一隻精靈, 唔使動畫
  const gen=battleGen;
  imgEl.style.opacity=0;  // 動畫期間隱形: 唔會見到舊精靈/空白/broken icon
  const ball=imgEl.parentElement.querySelector('.poke-ball');
  const enter=()=>{
    ball.classList.add('ball-throw');
    setTimeout(()=>{
      if(gen!==battleGen)return;  // 已開新戰, 舊排程失效
      imgEl.dataset.pid=pokeId;    // 延遲 set: renderCombatants 嘅 pChanging 先 detect 到「玩家有動畫」
      imgEl.style.opacity='';
      imgEl.classList.remove('poke-exit');  // 舊精靈 fade 完(保持隱形), 而家換新
      loadFn(imgEl,pokeId);          // 白光爆開嗰刻先換精靈, 避免球飛期間精靈已喺場
      ball.classList.remove('ball-throw');   // 球落地 → 本體 fade + 白光爆開
      ball.classList.add('ball-flash');
      imgEl.classList.add('poke-entrance');   // 精靈由白光現身
      const sf=document.getElementById('stageFlash');
      sf.classList.remove('on');
      void sf.offsetWidth;                    // 強制 reflow, 令動畫重播
      sf.classList.add('on');
      setTimeout(()=>{if(gen===battleGen)sf.classList.remove('on')},500);
    },550);
    setTimeout(()=>{
      if(gen!==battleGen)return;  // 已開新戰, 舊排程失效
      imgEl.classList.remove('poke-entrance');
      ball.classList.remove('ball-throw','ball-flash');
    },1200);
  };
  // 首次/新開戰(pid 清空): 直接由球釋出; img.src 唔可靠(空 string 會 resolve 成頁面 URL)
  if(!imgEl.dataset.pid){enter();return}
  ball.classList.add('ball-catch');
  imgEl.classList.add('poke-exit');
  // 精靈化光縮入 0.4s + 球 delay .15s 飛走 = .55s; 再停 .3s gap 先放新球, 兩次拋球唔會連埋
  // poke-exit 保留到 enter 內換精靈先移除(期間舊精靈保持 opacity 0)
  setTimeout(()=>{
    if(gen!==battleGen)return;  // 已開新戰, 舊排程失效
    ball.classList.remove('ball-catch');enter();
  },850);
}

function renderHearts(elId,hp,max){
  max=max||MAX_HP;
  document.getElementById(elId).innerHTML=Array(max).fill('❤️').map((h,i)=>`<span class="heart ${i<hp?'':'lost'}">${h}</span>`).join('');
}

function updateTypeHint(){
  const pPoke=battleState.playerTeam[battleState.playerIndex];
  const ePoke=battleState.enemyTeam[battleState.enemyIndex];
  const el=document.getElementById('typeHint');
  if(!pPoke||!ePoke||battleState.boss){el.classList.remove('show');return}
  const hint=getTypeHintText(pPoke,ePoke);
  el.textContent=hint.text;
  el.className='type-hint '+hint.cls;
  el.classList.add('show');
}

function updateProgress(){
  document.getElementById('battleProgress').textContent=battleState.boss
    ?'🤖 機械超夢'+(battleState.streak>0?` x${battleState.streak}`:'')
    :`第 ${battleState.enemyIndex+1}/5 隻`;
  const s=battleState.streak;
  document.getElementById('streakDisplay').textContent=s>1?`🔥 連擊 x${s}`:'';
}

function getMathLevelForEnemy(index){const map={0:1,1:2,2:3,3:4,4:5};return map[index]||1}

// ===== QUESTION & ANSWER (4-CHOICE) =====
function nextQuestion(){
  // ✅ FIX: reset roundBusy FIRST to prevent deadlock
  battleState.roundBusy=false;

  const level=getMathLevelForEnemy(battleState.enemyIndex);
  const grid=document.getElementById('choicesGrid');
  if(battleState.boss){
    // 小一奧數固定題庫, 順序出 (streak = 已答對數)
    const q=battleState.bossQuestions[Math.min(battleState.streak,battleState.bossQuestions.length-1)];
    battleState.currentQuestion=q;
    battleState.timeLeft=ANSWER_TIME;
    document.getElementById('mathQuestion').textContent=q.q;
    grid.innerHTML=q.opts.map(c=>`<button class="choice-btn" data-value="${c}" onclick="submitChoice(${c},this)">${c}</button>`).join('');
  }else{
  battleState.currentQuestion=generateQuestion(level);
  battleState.timeLeft=ANSWER_TIME;

  document.getElementById('mathQuestion').textContent=battleState.currentQuestion.q;

  // Generate 4 choices
  const choices=generateChoices(battleState.currentQuestion.a);
  grid.innerHTML=choices.map(c=>
    `<button class="choice-btn" data-value="${c}" onclick="submitChoice(${c},this)">${c}</button>`
  ).join('');
  }

  fitQuestion();  // 題幹一行放唔落就自動縮字

  updateTimerDisplay();
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    battleState.timeLeft-=0.1;
    updateTimerDisplay();
    if(battleState.timeLeft<=0){clearInterval(timerInterval);handleTimeout()}
  },100);

  updateProgress();
  updateReviveButton();
}

function updateTimerDisplay(){
  const pct=Math.max(0,(battleState.timeLeft/ANSWER_TIME)*100);
  document.getElementById('timerBar').style.width=pct+'%';
}

function submitChoice(value,btn){
  if(battleState.roundBusy)return;
  // Anti-spam: disable all buttons immediately
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  clearInterval(timerInterval);
  battleState.roundBusy=true;
  battleState.questionsTotal++;
  const correct=value===battleState.currentQuestion.a;
  if(correct){
    battleState.questionsCorrect++;
    battleState.streak++;
    battleState.bestStreak=Math.max(battleState.bestStreak,battleState.streak);
    btn.classList.add('correct');
    sfxCorrect();
  }else{
    battleState.streak=0;
    btn.classList.add('wrong');
    // Highlight correct answer
    document.querySelectorAll('.choice-btn').forEach(b=>{
      if(parseInt(b.dataset.value)===battleState.currentQuestion.a)b.classList.add('correct');
    });
    sfxWrong();
  }
  updateProgress();
  const g=battleGen;
  setTimeout(()=>{if(battleGen!==g)return;handleAnswer(correct)},600);
}

function handleAnswer(isCorrect){
  const g=battleGen;
  if(isCorrect){
    showMsg('✅ 答對了！','good');
    if(battleState.boss){
      // Boss: 每答對 1 題扣 1 血, 無暴擊/屬性 (6 連對即勝)
      setTimeout(()=>{
        if(battleGen!==g)return;
        sfxHit();
        const b=battleState.enemyTeam[0];
        b.currentHp=Math.max(0,b.currentHp-1);
        renderHearts('enemyHearts',b.currentHp,6);
        document.getElementById('enemyImg').classList.add('hit');
        setTimeout(()=>document.getElementById('enemyImg').classList.remove('hit'),500);
        renderTeamBars();
        if(b.currentHp<=0){setTimeout(()=>{if(battleGen===g)handleEnemyFainted()},800)}
        else{setTimeout(()=>{if(battleGen!==g)return;hideMsg();nextQuestion()},1200)}
      },400);
      return;
    }
    const pPoke=battleState.playerTeam[battleState.playerIndex];
    const ePoke=battleState.enemyTeam[battleState.enemyIndex];
    let dmg=1,isCrit=false;
    if(isSuperEffective(pPoke.types,ePoke.types)&&Math.random()<.3){dmg=2;isCrit=true}
    setTimeout(()=>{
      if(battleGen!==g)return;
      const pImg=document.getElementById('playerImg');
      pImg.classList.add('attack-lunge');
      setTimeout(()=>pImg.classList.remove('attack-lunge'),300);
      setTimeout(()=>{
        if(battleGen!==g)return;
        sfxHit();
        ePoke.currentHp=Math.max(0,ePoke.currentHp-dmg);
        renderHearts('enemyHearts',ePoke.currentHp);
        const eImg=document.getElementById('enemyImg');
        eImg.classList.add('hit');
        if(dmg>=2)eImg.classList.add('knockback');
        setTimeout(()=>eImg.classList.remove('hit','knockback'),500);
        if(isCrit)showMsg(`💥 暴擊！屬性有利！`,'crit');
        renderTeamBars();
        if(ePoke.currentHp<=0){setTimeout(()=>{if(battleGen===g)handleEnemyFainted()},800)}
        else{setTimeout(()=>{if(battleGen!==g)return;hideMsg();nextQuestion()},1200)}
      },300);
    },400);
  }else{
    showMsg(`❌ 答錯了！`,'bad');
    if(battleState.boss){setTimeout(()=>{if(battleGen!==g)endBattle('defeat')},900);return}
    setTimeout(()=>{if(battleGen!==g)return;handleEnemyAttack()},800);
  }
}

function handleTimeout(){
  const g=battleGen;
  battleState.roundBusy=true;
  battleState.streak=0;
  updateProgress();
  sfxWrong();
  showMsg(`⏰ 時間到！`,'bad');
  if(battleState.boss){setTimeout(()=>{if(battleGen!==g)endBattle('defeat')},900);return}
  setTimeout(()=>{if(battleGen!==g)return;handleEnemyAttack()},800);
}

function handleEnemyAttack(){
  const g=battleGen;
  const pPoke=battleState.playerTeam[battleState.playerIndex];
  const ePoke=battleState.enemyTeam[battleState.enemyIndex];
  let dmg=1,isCrit=false;
  if(isSuperEffective(ePoke.types,pPoke.types)&&Math.random()<.3){dmg=2;isCrit=true}
  const eImg=document.getElementById('enemyImg');
  eImg.classList.add('attack-lunge');
  setTimeout(()=>eImg.classList.remove('attack-lunge'),300);
  setTimeout(()=>{
    if(battleGen!==g)return;
    sfxHit();
    pPoke.currentHp=Math.max(0,pPoke.currentHp-dmg);
    renderHearts('playerHearts',pPoke.currentHp);
    const pImg=document.getElementById('playerImg');
    pImg.classList.add('hit');
    if(dmg>=2)pImg.classList.add('knockback');
    setTimeout(()=>pImg.classList.remove('hit','knockback'),500);
    if(isCrit)showMsg('💥 敵方暴擊！','crit');
    else showMsg('💥 受到攻擊！','bad');
    renderTeamBars();
    if(pPoke.currentHp<=0){setTimeout(()=>{if(battleGen===g)handlePlayerFainted()},800)}
    else{setTimeout(()=>{if(battleGen!==g)return;hideMsg();nextQuestion()},1200)}
  },300);
}

function handleEnemyFainted(){
  const g=battleGen;
  if(battleState.boss){endBattle('victory');return}  // Boss: 6 連對擊敗即勝
  battleState.coinsEarned+=1;
  showCoinPopup('+1 🪙');
  sfxKO();
  const eImg=document.getElementById('enemyImg');
  eImg.classList.add('fainted-img');
  showMsg(`🎉 ${battleState.enemyTeam[battleState.enemyIndex].zh} 倒下了！`,'good');
  setTimeout(()=>{
    if(battleGen!==g)return;  // 已投降/結束, 唔好再推進戰鬥
    battleState.enemyIndex++;
    if(battleState.enemyIndex>=5){endBattle('victory')}
    else{
      hideMsg();
      renderCombatants();
      renderTeamBars();
      updateTypeHint();
      updateProgress();
      nextQuestion();
    }
  },1500);
}

function handlePlayerFainted(){
  const g=battleGen;
  const pImg=document.getElementById('playerImg');
  pImg.classList.add('fainted-img');
  showMsg(`😵 ${battleState.playerTeam[battleState.playerIndex].zh} 倒下了！`,'bad');
  setTimeout(()=>{
    if(battleGen!==g)return;  // 已投降/結束, 唔好再推進戰鬥
    let nextIdx=-1;
    for(let i=0;i<5;i++){if(battleState.playerTeam[i].currentHp>0){nextIdx=i;break}}
    if(nextIdx===-1){endBattle('defeat')}
    else{
      battleState.playerIndex=nextIdx;
      battleState.streak=0;
      hideMsg();
      renderCombatants();
      renderTeamBars();
      updateTypeHint();
      updateProgress();
      nextQuestion();
    }
  },1500);
}

function revivePokemon(){
  if(gymState.coins<1||battleState.roundBusy)return;
  const idx=battleState.playerTeam.findIndex(p=>p.currentHp<=0);
  if(idx===-1)return;
  gymState.coins-=1;
  saveGymState();
  updateCoinDisplay();
  battleState.playerTeam[idx].currentHp=MAX_HP;
  renderTeamBars();
  showMsg('🌀 復活成功！','info');
  sfxRevive();
  updateReviveButton();
  setTimeout(hideMsg,1000);
}

function updateReviveButton(){
  const btn=document.getElementById('reviveBtn');
  const hasFainted=battleState.playerTeam.some(p=>p.currentHp<=0);
  btn.disabled=!(hasFainted&&gymState.coins>=1&&!battleState.roundBusy);
}

function forfeitBattle(){
  if(!confirm('確定要投降嗎？'))return;
  clearInterval(timerInterval);
  endBattle('forfeit');
}

function endBattle(result){
  battleGen++;  // 戰鬥結束 → 所有 pending setTimeout(輪轉/攻擊鏈/倒數)失效
  clearInterval(timerInterval);
  battleState.phase='ended';
  let title='',subtitle='',isWin=false;
  if(result==='victory'){
    if(battleState.boss){
      title='🏆 機械超夢討伐成功！';subtitle='6 連答對，完美壓制機械超夢！';
    }else{
      title='🏆 道館挑戰成功！';subtitle='太厲害了！你擊敗了館主！';
    }
    isWin=true;battleState.coinsEarned+=3;
    gymState.totalWins++;
    gymState.bestStreak=Math.max(gymState.bestStreak,battleState.bestStreak);
    if(!battleState.boss)gymState.bestKOs=Math.max(gymState.bestKOs,battleState.enemyIndex);
    sfxVictory();
  }else if(result==='defeat'){
    title=battleState.boss?'💀 機械超夢太強了...':'💀 挑戰失敗...';
    subtitle='不要氣餒，再試一次吧！';
    sfxDefeat();
  }else{
    title='🏳️ 已投降';subtitle='保存實力，下次再戰！';
  }
  gymState.coins+=battleState.coinsEarned;
  gymState.totalBattles++;
  saveGymState();
  updateCoinDisplay();
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultTitle').className='result-title '+(isWin?'victory':'defeat');
  document.getElementById('resultSubtitle').textContent=subtitle;
  document.getElementById('statKOs').textContent=battleState.boss?1:battleState.enemyIndex;
  document.getElementById('statCorrect').textContent=battleState.questionsCorrect;
  document.getElementById('statAttempts').textContent=battleState.questionsTotal;
  const acc=battleState.questionsTotal?Math.round(battleState.questionsCorrect/battleState.questionsTotal*100):0;
  document.getElementById('statAccuracy').textContent=acc+'%';
  document.getElementById('statStreak').textContent=battleState.bestStreak;
  document.getElementById('statCoins').textContent=battleState.coinsEarned+' 🪙';
  showView('resultView');
}

function backToMenu(){
  showView('menuView');
  updateCoinDisplay();
  const bgm=document.getElementById('bgm');
  if(bgm)bgm.pause();
}

// ===== AUDIO (BGM + Web Audio SFX) =====
let soundOn=true;
function getAudioCtx(){
  if(!soundOn)return null;
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  return actx;
}
function initAudio(){
  const ctx=getAudioCtx();
  const bgm=document.getElementById('bgm');
  if(!soundOn||!bgm)return;
  const doPlay=()=>{bgm.currentTime=0;const p=bgm.play();if(p)p.catch(()=>{})};  // 每場由頭播
  if(ctx&&ctx.state==='suspended'){ctx.resume().then(doPlay).catch(doPlay)}
  else{doPlay()}
}
function toggleSound(){
  soundOn=!soundOn;
  gymState.sound=soundOn;
  saveGymState();
  applySound();
}
function applySound(){
  const btn=document.getElementById('soundToggle');
  if(btn){btn.textContent=soundOn?'🔊':'🔇';btn.classList.toggle('muted',!soundOn)}
  const bgm=document.getElementById('bgm');
  if(!soundOn){if(bgm)bgm.pause();return}
  if(soundOn&&battleState&&battleState.phase==='battle'&&bgm){const p=bgm.play();if(p)p.catch(()=>{})}
}

function sfxCorrect(){
  try{
    const ctx=getAudioCtx();
    const notes=[523,659,784];
    notes.forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+i*0.08);
      g.gain.linearRampToValueAtTime(0.1,ctx.currentTime+i*0.08+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.08+0.2);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime+i*0.08);o.stop(ctx.currentTime+i*0.08+0.2);
    });
  }catch(e){}
}

function sfxWrong(){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(200,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.3);
    g.gain.setValueAtTime(0.08,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.connect(g).connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.3);
  }catch(e){}
}

function sfxHit(){
  if(!soundOn)return;
  try{
    const a=new Audio('gym-attack.mp3');
    a.volume=0.9;
    const p=a.play();if(p)p.catch(()=>{});
  }catch(e){}
}

function sfxKO(){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.setValueAtTime(400,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.5);
    g.gain.setValueAtTime(0.1,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    o.connect(g).connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function sfxRevive(){
  try{
    const ctx=getAudioCtx();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(300,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(600,ctx.currentTime+0.3);
    g.gain.setValueAtTime(0.1,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    o.connect(g).connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.4);
  }catch(e){}
}

function sfxVictory(){
  try{
    const ctx=getAudioCtx();
    const notes=[523,659,784,1047];
    notes.forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+i*0.15);
      g.gain.linearRampToValueAtTime(0.1,ctx.currentTime+i*0.15+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+0.3);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime+i*0.15);o.stop(ctx.currentTime+i*0.15+0.3);
    });
  }catch(e){}
}

function sfxDefeat(){
  try{
    const ctx=getAudioCtx();
    const notes=[300,250,200,150];
    notes.forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle';o.frequency.value=freq;
      g.gain.setValueAtTime(0.1,ctx.currentTime+i*0.2);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.2+0.3);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime+i*0.2);o.stop(ctx.currentTime+i*0.2+0.3);
    });
  }catch(e){}
}
